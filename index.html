<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Language Translator</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

    <!-- Main Container -->
    <div class="container">


        <!-- Header -->
        <header class="header">

            <div>

                <h1>🌐 Language Translator</h1>

                <p>
                    Translate text quickly and easily
                </p>

            </div>


            <!-- Dark Mode -->
            <button
                id="themeButton"
                class="theme-button"
                title="Toggle Dark Mode">

                🌙

            </button>

        </header>



        <!-- Language Selection -->
        <div class="language-section">


            <div class="language-box">

                <label for="sourceLanguage">
                    From
                </label>

                <select id="sourceLanguage">

                    <option value="en">
                        English
                    </option>

                    <option value="te">
                        Telugu
                    </option>

                    <option value="hi">
                        Hindi
                    </option>

                    <option value="ta">
                        Tamil
                    </option>

                    <option value="kn">
                        Kannada
                    </option>

                    <option value="ml">
                        Malayalam
                    </option>

                    <option value="mr">
                        Marathi
                    </option>

                    <option value="bn">
                        Bengali
                    </option>

                    <option value="gu">
                        Gujarati
                    </option>

                    <option value="pa">
                        Punjabi
                    </option>

                    <option value="fr">
                        French
                    </option>

                    <option value="de">
                        German
                    </option>

                    <option value="es">
                        Spanish
                    </option>

                    <option value="it">
                        Italian
                    </option>

                    <option value="pt">
                        Portuguese
                    </option>

                    <option value="ja">
                        Japanese
                    </option>

                    <option value="ko">
                        Korean
                    </option>

                    <option value="zh">
                        Chinese
                    </option>

                    <option value="ar">
                        Arabic
                    </option>

                    <option value="ru">
                        Russian
                    </option>

                </select>

            </div>



            <!-- Swap -->
            <button
                id="swapButton"
                class="swap-button"
                title="Swap Languages">

                ⇄

            </button>



            <div class="language-box">

                <label for="targetLanguage">
                    To
                </label>

                <select id="targetLanguage">

                    <option value="te">
                        Telugu
                    </option>

                    <option value="en">
                        English
                    </option>

                    <option value="hi">
                        Hindi
                    </option>

                    <option value="ta">
                        Tamil
                    </option>

                    <option value="kn">
                        Kannada
                    </option>

                    <option value="ml">
                        Malayalam
                    </option>

                    <option value="mr">
                        Marathi
                    </option>

                    <option value="bn">
                        Bengali
                    </option>

                    <option value="gu">
                        Gujarati
                    </option>

                    <option value="pa">
                        Punjabi
                    </option>

                    <option value="fr">
                        French
                    </option>

                    <option value="de">
                        German
                    </option>

                    <option value="es">
                        Spanish
                    </option>

                    <option value="it">
                        Italian
                    </option>

                    <option value="pt">
                        Portuguese
                    </option>

                    <option value="ja">
                        Japanese
                    </option>

                    <option value="ko">
                        Korean
                    </option>

                    <option value="zh">
                        Chinese
                    </option>

                    <option value="ar">
                        Arabic
                    </option>

                    <option value="ru">
                        Russian
                    </option>

                </select>

            </div>

        </div>



        <!-- Translation Area -->
        <div class="translation-area">


            <!-- Input -->
            <div class="text-box">

                <div class="box-header">

                    <h3>📝 Enter Text</h3>

                    <button
                        id="voiceButton"
                        class="small-button"
                        title="Voice Input">

                        🎤

                    </button>

                </div>


                <textarea
                    id="inputText"
                    maxlength="5000"
                    placeholder="Type your text here...">
                </textarea>


                <div class="bottom-info">

                    <span id="characterCount">
                        0
                    </span>

                    <span>
                        / 5000 characters
                    </span>

                </div>

            </div>



            <!-- Translation -->
            <div class="text-box">

                <div class="box-header">

                    <h3>🌐 Translation</h3>

                    <button
                        id="resultSpeakButton"
                        class="small-button"
                        title="Speak Translation">

                        🔊

                    </button>

                </div>


                <div
                    id="translationResult"
                    class="result">

                    Your translation will appear here...

                </div>

            </div>

        </div>



        <!-- Status -->
        <div
            id="statusMessage"
            class="status">
        </div>



        <!-- Main Buttons -->
        <div class="buttons">

            <button
                id="translateButton"
                class="translate-button">

                🔄 Translate

            </button>


            <button
                id="copyButton"
                class="secondary-button">

                📋 Copy

            </button>


            <button
                id="speakButton"
                class="secondary-button">

                🔊 Speak

            </button>


            <button
                id="clearButton"
                class="secondary-button">

                🗑️ Clear

            </button>

        </div>



        <!-- History -->
        <section class="history-section">

            <div class="history-header">

                <h2>
                    🕘 Translation History
                </h2>


                <button
                    id="clearHistoryButton"
                    class="clear-history-button">

                    Clear History

                </button>

            </div>


            <div
                id="historyList"
                class="history-list">

                <p class="empty-history">
                    No translation history yet.
                </p>

            </div>

        </section>



        <!-- Footer -->
        <footer>

            <p>
                🌐 Language Translator
            </p>

            <p>
                Built with HTML, CSS, JavaScript and Translation API
            </p>

        </footer>

    </div>


    <script src="script.js"></script>

</body>

</html>
